name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # GitHub can deliver private-repository push events out of order. Keying by commit
  # prevents an older delayed event from canceling validation of the current revision.
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and integrate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build with strict concurrency
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Run test suite
        run: swift test
      - name: Run isolated integration test
        run: ./Scripts/integration-test.sh
      - name: Verify repository contains no tracked build output or local settings
        run: |
          if git ls-files | rg '(^|/)(build|\.build)/|\.dmg$|\.DS_Store$|settings\.local\.json$'; then
            echo 'Tracked generated or local files were found.' >&2
            exit 1
          fi
